<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-b0aac7c69e7d20db43e09f09b19bcb26"}, "mark": {"type": "bar"}, "encoding": {"tooltip": [{"field": "metal_level", "type": "nominal"}, {"field": "mean_delta", "type": "quantitative"}], "x": {"field": "metal_level", "type": "nominal"}, "y": {"field": "mean_delta", "type": "quantitative"}}, "title": "Mean Delta by Metal Level: Regulatory Cliff Analysis (V24 -> V28)", "$schema": "https://vega.github.io/schema/vega-lite/v6.1.0.json", "datasets": {"data-b0aac7c69e7d20db43e09f09b19bcb26": [{"metal_level": "platinum", "mean_delta": 0.09050882212684791}, {"metal_level": "bronze", "mean_delta": 0.0614644035832157}, {"metal_level": "silver", "mean_delta": 0.07430103295622244}, {"metal_level": "gold", "mean_delta": 0.1000645161290319}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
