version: 2

models:
  - name: int_member_months
    description: Calculated enrollment duration in months for each member. Capped at 12 months.
    columns:
      - name: member_id
        description: Unique identifier for the member
        tests:
          - unique
          - not_null
      - name: enrollment_months
        description: Number of months the member was enrolled (1-12)
      - name: gender
        description: Member's gender
      - name: metal_level
        description: Insurance plan metal level
      - name: date_of_birth
        description: Member's date of birth

  - name: int_member_diagnoses
    description: Aggregated list of unique diagnosis codes per member.
    columns:
      - name: member_id
        description: Unique identifier for the member
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('int_member_months')
              field: member_id
      - name: diagnosis_list
        description: Array of unique ICD-10 diagnosis codes for the member

  - name: int_member_rx
    description: Aggregated list of unique NDC codes per member.
    columns:
      - name: member_id
        description: Unique identifier for the member
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('int_member_months')
              field: member_id
      - name: ndc_list
        description: Array of unique NDC codes for the member

  - name: int_aca_risk_input
    description: |
      Consolidated input table for ACA risk scoring. 
      Joins member demographics, enrollment duration, diagnosis lists, and NDC lists into a single wide table.
      This is the primary input for the risk scoring calculator.
    columns:
      - name: member_id
        description: Unique identifier for the member
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('int_member_months')
              field: member_id
      - name: enrollment_months
        description: Number of months the member was enrolled
      - name: gender
        description: Member's gender
      - name: metal_level
        description: Insurance plan metal level
      - name: date_of_birth
        description: Member's date of birth
      - name: diagnoses
        description: List of diagnosis codes
      - name: ndc_codes
        description: List of NDC codes

  - name: int_run_member_dimensions
    description: |
      Derived dimensional attributes for members within a specifc run. 
      Used for slicing and dicing metrics by Age Band, HCC Count Band, etc.
    columns:
      - name: run_id
        description: FK to the run registry
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('dagster_runs', 'run_registry')
                field: run_id
      - name: member_id
        description: FK to the member
        tests:
          - not_null
      - name: model
        description: The model version utilized (e.g., 'V05').
      - name: gender
        description: Member gender.
      - name: metal_level
        description: Metal level of the plan.
      - name: enrollment_months
        description: Duration of enrollment (1-12).
      - name: age_band
        description: Age bucket (0-17, 18-29, etc.)
      - name: hcc_count_band
        description: Bucketed count of HCCs (0, 1, 2, 3+)
      - name: has_rxc
        description: "'Yes' if the member triggered any RXC, else 'No'"
