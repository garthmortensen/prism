
name: 'prism'
version: '0.1.0'
config-version: 2

profile: 'prism'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

seeds:
  prism:
    schema: dbt_raw
    +quote_columns: false
    +enabled: true
    raw_members:
      +column_types:
        member_id: varchar
        plan_metal: varchar
    raw_enrollments:
      +column_types:
        enrollment_id: varchar
        member_id: varchar
        plan_id: varchar
    raw_claims:
      +column_types:
        member_id: varchar
        claim_id: varchar
        provider_id: varchar
    raw_plans:
      +column_types:
        plan_id: varchar
        name: varchar
    raw_providers:
      +column_types:
        provider_id: varchar
        name: varchar

models:
  prism:
    # Config for all models
    materialized: view

    raw_views:
      materialized: view
      schema: dbt_raw

    staging:
      materialized: view
      schema: dbt_staging

    intermediate:
      materialized: view
      schema: dbt_intermediate

    marts:
      materialized: view
      schema: dbt_marts
      scoring:
        materialized: view
        schema: dbt_marts
      operational:
        materialized: view
        schema: dbt_marts

    quality:
      materialized: view
      schema: dbt_quality


